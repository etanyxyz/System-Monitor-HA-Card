name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the HACS asset exists
        run: test -f resource-monitor-card.js && node --check resource-monitor-card.js

      - uses: softprops/action-gh-release@v2
        with:
          files: resource-monitor-card.js
          generate_release_notes: true
